- name: Ensure required CLI tools are installed
  ansible.builtin.command: "bash -lc 'command -v {{ item }}'"
  loop:
    - kind
    - kubectl
    - istioctl
    - helm
    - curl
  changed_when: false

- name: Ensure jq is installed
  ansible.builtin.command: "bash -lc 'command -v jq'"
  changed_when: false
