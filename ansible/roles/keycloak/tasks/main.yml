- name: Add bitnami helm repo
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami

- name: Update helm repos
  kubernetes.core.helm_repository:
    name: bitnami
    repo_url: https://charts.bitnami.com/bitnami
    force_update: true

- name: Install or upgrade Keycloak
  kubernetes.core.helm:
    name: keycloak
    chart_ref: bitnami/keycloak
    chart_version: "24.7.7"
    release_namespace: "{{ keycloak_namespace }}"
    create_namespace: true
    values:
      auth:
        adminUser: "{{ keycloak_admin_user }}"
        adminPassword: "{{ keycloak_admin_password }}"
      service:
        type: NodePort
        nodePorts:
          http: "{{ keycloak_node_port_http }}"
      image:
        repository: bitnamilegacy/keycloak
      postgresql:
        image:
          repository: bitnamilegacy/postgresql
      global:
        security:
          allowInsecureImages: true
    wait: true
    wait_timeout: 300s

- name: Wait for Keycloak pod readiness
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ keycloak_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=keycloak
  register: keycloak_pods
  retries: 36
  delay: 5
  until: >-
    (keycloak_pods.resources | length) > 0 and
    (keycloak_pods.resources | map(attribute='status.phase') | list | unique) == ['Running']
