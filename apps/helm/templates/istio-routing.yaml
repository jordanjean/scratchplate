{{- if .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "app.gatewayName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: {{ .Values.istio.gateway.port.number }}
        name: {{ .Values.istio.gateway.port.name }}
        protocol: {{ .Values.istio.gateway.port.protocol }}
      hosts:
        {{- toYaml .Values.istio.gateway.hosts | nindent 8 }}
---
{{- end }}
{{- if .Values.istio.virtualService.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.istio.virtualService.hosts | nindent 4 }}
  gateways:
    - {{ include "app.gatewayName" . }}
  http:
    - match:
        - uri:
            prefix: {{ .Values.istio.virtualService.pathPrefix }}
      rewrite:
        uri: {{ .Values.istio.virtualService.rewriteUri }}
      route:
        - destination:
            host: {{ include "app.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}

