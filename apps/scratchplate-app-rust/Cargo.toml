[package]
name = "scratchplate-app-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "=0.1.92"
axum = "=0.7.9"
http = "=1.5.0"
jsonwebtoken = "=9.3.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
