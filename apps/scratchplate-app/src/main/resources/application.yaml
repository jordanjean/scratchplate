spring:
  application:
    name: scratchplate-app
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # The "iss" claim expected in tokens (as seen by the client that obtained them).
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:32000/realms/scratchplate}
          # Where keys are fetched from (in-cluster address). When set alongside issuer-uri,
          # Spring validates the issuer claim without calling the discovery endpoint.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:32000/realms/scratchplate/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  # In Kubernetes, MANAGEMENT_SERVER_PORT moves actuator to a dedicated, non-exposed port.
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

scratchplate:
  welcome:
    admin-template: "Welcome {username}! You are signed in as an administrator: you have full access to the platform."
    user-template: "Welcome {username}! You are signed in as a regular user."

logging:
  level:
    root: INFO


