cluster_name: scratchplate
kind_config_tmp_path: /tmp/scratchplate-kind-config.yaml

keycloak_namespace: keycloak
keycloak_url: http://localhost:32000
keycloak_admin_user: admin
keycloak_admin_password: admin
keycloak_realm: scratchplate
keycloak_demo_client_id: demo-client
keycloak_demo_user: user
keycloak_demo_user_email: user@demo.net
keycloak_demo_user_password: user
keycloak_demo_admin: admin
keycloak_demo_admin_email: admin@demo.net
keycloak_demo_admin_password: admin

httpbin_namespace: httpbin
apps_dir: "{{ playbook_dir }}/../../../apps"
# Docker (snap) can't access /tmp or hidden dirs: use a visible dir for `kind load`
kind_load_tmp_dir: "{{ playbook_dir }}/../kind-tmp"
# Each app lives in apps/<name> (build-image.sh, helm/values.yaml) and is deployed in the namespace <name>
apps:
  - name: scratchplate-app
    image_tag: "0.1.0"
    path_prefix: /scratchplate/
  - name: scratchplate-app-rust
    image_tag: "0.1.0"
    path_prefix: /scratchplate-rust/
  - name: scratchplate-app-python
    image_tag: "0.1.0"
    path_prefix: /scratchplate-python/

istio_ingress_node_port_http: 30080
istio_ingress_node_port_https: 30443
keycloak_node_port_http: 32000

kind_extra_port_mappings:
  - container_port: 32000
    host_port: 32000
  - container_port: 30080
    host_port: 30080
  - container_port: 30443
    host_port: 30443
