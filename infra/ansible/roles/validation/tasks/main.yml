- name: Wait for httpbin readiness
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ httpbin_namespace }}"
    name: httpbin
  register: httpbin_deployment
  retries: 36
  delay: 5
  until: >-
    (httpbin_deployment.resources | length) > 0 and
    (httpbin_deployment.resources[0].status.availableReplicas | default(0) | int) > 0

- name: Wait for application readiness
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ app.name }}"
    name: "{{ app.name }}"
  register: app_deployment
  retries: 36
  delay: 5
  until: >-
    (app_deployment.resources | length) > 0 and
    (app_deployment.resources[0].status.availableReplicas | default(0) | int) > 0
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"

- name: Resolve ingress node port for HTTP
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: istio-system
    name: istio-ingressgateway
  register: ingress_gateway_service

- name: Set ingress node port fact
  ansible.builtin.set_fact:
    ingress_port: >-
      {{
        (
          ingress_gateway_service.resources[0].spec.ports
          | selectattr('port', 'equalto', 80)
          | map(attribute='nodePort')
          | first
        )
      }}

- name: Print httpbin URL
  ansible.builtin.debug:
    msg: "httpbin: http://localhost:{{ ingress_port }}/headers"

- name: Print application URLs
  ansible.builtin.debug:
    msg: "{{ app.name }}: http://localhost:{{ ingress_port }}{{ app.path_prefix }}api/v1/welcome (bearer token required)"
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
