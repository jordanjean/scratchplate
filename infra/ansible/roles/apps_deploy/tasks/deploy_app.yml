- name: "{{ app.name }} | Ensure namespace exists with Istio injection"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ app.name }}"
        labels:
          istio-injection: enabled

- name: "{{ app.name }} | Build image (runs the tests)"
  ansible.builtin.command:
    cmd: "{{ apps_dir }}/{{ app.name }}/build-image.sh {{ app.name }}:{{ app.image_tag }}"
  changed_when: true

- name: "{{ app.name }} | Create temp dir for kind image loading"
  ansible.builtin.file:
    path: "{{ kind_load_tmp_dir }}"
    state: directory
    mode: "0755"

- name: "{{ app.name }} | Load image into kind"
  ansible.builtin.command:
    cmd: "kind load docker-image {{ app.name }}:{{ app.image_tag }} --name {{ cluster_name }}"
  environment:
    # Snap-packaged Docker cannot access /tmp or hidden dirs, which kind needs for `docker save`
    TMPDIR: "{{ kind_load_tmp_dir }}"
  changed_when: true

- name: "{{ app.name }} | Deploy Helm chart"
  kubernetes.core.helm:
    name: "{{ app.name }}"
    chart_ref: "{{ apps_dir }}/helm"
    release_namespace: "{{ app.name }}"
    create_namespace: true
    values_files:
      - "{{ apps_dir }}/{{ app.name }}/helm/values.yaml"
    values:
      image:
        repository: "{{ app.name }}"
        tag: "{{ app.image_tag }}"
      istio:
        virtualService:
          pathPrefix: "{{ app.path_prefix }}"
      security:
        requestAuthentication:
          issuer: "{{ keycloak_url }}/realms/{{ keycloak_realm }}"
          jwksUri: "http://keycloak-headless.{{ keycloak_namespace }}.svc.cluster.local:8080/realms/{{ keycloak_realm }}/protocol/openid-connect/certs"
    wait: true
    wait_timeout: 300s
