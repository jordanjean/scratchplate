- name: Ensure httpbin namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ httpbin_namespace }}"
        labels:
          istio-injection: enabled

- name: Label httpbin namespace for injection
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ httpbin_namespace }}"
        labels:
          istio-injection: enabled

- name: Deploy httpbin workload
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../resources/istio-1.26.2/samples/httpbin/httpbin.yaml"
    namespace: "{{ httpbin_namespace }}"

- name: Deploy httpbin gateway and virtual service
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../resources/istio-1.26.2/samples/httpbin/httpbin-gateway.yaml"
    namespace: "{{ httpbin_namespace }}"

- name: Apply root request authentication policy
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../resources/request-authentication.yaml"

- name: Apply root authorization policy
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../../resources/authorization-policy.yaml"

- name: Ensure scratchplate app namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ scratchplate_app_namespace }}"
        labels:
          istio-injection: enabled

- name: Label scratchplate app namespace for injection
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ scratchplate_app_namespace }}"
        labels:
          istio-injection: enabled

- name: Build scratchplate app image with Jib (compiles and runs tests)
  ansible.builtin.command:
    cmd: >-
      {{ scratchplate_app_source_dir }}/build-image.sh
      {{ scratchplate_app_image_repository }}:{{ scratchplate_app_image_tag }}
  changed_when: true

- name: Create temp dir for kind image loading
  ansible.builtin.file:
    path: "{{ scratchplate_app_source_dir }}/target/kind-tmp"
    state: directory
    mode: "0755"

- name: Load scratchplate app image into kind
  ansible.builtin.command:
    cmd: >-
      kind load docker-image
      {{ scratchplate_app_image_repository }}:{{ scratchplate_app_image_tag }}
      --name {{ cluster_name }}
  environment:
    # Snap-packaged Docker cannot access /tmp or hidden dirs, which kind needs for `docker save`
    TMPDIR: "{{ scratchplate_app_source_dir }}/target/kind-tmp"
  changed_when: true

- name: Deploy scratchplate app Helm chart
  kubernetes.core.helm:
    name: "{{ scratchplate_app_release_name }}"
    chart_ref: "{{ playbook_dir }}/../../../apps/helm"
    release_namespace: "{{ scratchplate_app_namespace }}"
    create_namespace: true
    values_files:
      - "{{ scratchplate_app_source_dir }}/helm/values.yaml"
    values:
      image:
        repository: "{{ scratchplate_app_image_repository }}"
        tag: "{{ scratchplate_app_image_tag }}"
      istio:
        virtualService:
          pathPrefix: "{{ scratchplate_app_path_prefix }}"
      security:
        requestAuthentication:
          issuer: "{{ keycloak_url }}/realms/{{ keycloak_realm }}"
          jwksUri: "http://keycloak-headless.{{ keycloak_namespace }}.svc.cluster.local:8080/realms/{{ keycloak_realm }}/protocol/openid-connect/certs"
    wait: true
    wait_timeout: 300s
