apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app: demo-app
    service: demo-app
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 80
  selector:
    app: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
      version: v1
  template:
    metadata:
      labels:
        app: demo-app
        version: v1
    spec:
      serviceAccountName: demo-app
      containers:
      - name: static-server
        image: httpd:2.4
        command: [ "/bin/sh", "-c" ]
        args:
          - |
            mkdir -p /usr/local/apache2/htdocs && \
            cp /config/index.html /usr/local/apache2/htdocs/index.html && \
            cp /config/image.png /usr/local/apache2/htdocs/image.png && \
            httpd-foreground
        ports:
          - containerPort: 80
        volumeMounts:
          - name: image-volume
            mountPath: /config
      volumes:
        - name: image-volume
          configMap:
            name: image-configmap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-configmap
data:
  index.html: |
    <html>
    <head>
        <title>Demo App</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background: #f0f0f0;
            }
            img {
                max-width: 90%;
                height: auto;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
    <img src="demo/image.png">
    </body>
    </html>
